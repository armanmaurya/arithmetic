name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Standard Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev file zstd

      - name: Install appimagetool (Extracted, no FUSE needed)
        run: |
          curl -sLo /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          cd /tmp && /tmp/appimagetool --appimage-extract
          sudo mv /tmp/squashfs-root /usr/local/appimagetool
          sudo ln -s /usr/local/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Install official Cargo packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-aur

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Build stripped release binary
        run: cargo build --release

      - name: Prepare dist directory
        run: mkdir -p target/dist

      - name: Build Debian Package (cargo deb)
        run: cargo deb --no-build -o target/dist/

      - name: Build Red Hat Package (cargo generate-rpm)
        run: cargo generate-rpm -o target/dist/

      - name: Build Universal AppImage (cargo appimage)
        run: |
          cargo appimage
          cp target/appimage/*.AppImage target/dist/

      - name: Build Standalone Tarball (cargo aur)
        run: |
          cargo aur -o target/dist/
          rm -f target/dist/PKGBUILD

      - name: Upload Standard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standard-pkgs
          path: target/dist/*
          retention-days: 1

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syu --noconfirm rust fontconfig freetype2 libxkbcommon wayland

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c './packaging/build-arch.sh'

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: target/dist/*.pkg.tar.zst
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-packages, build-arch]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/dist
          merge-multiple: true

      - name: Normalize Asset Names
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi
          cd target/dist
          for f in *.deb; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-amd64.deb"; done
          for f in *.rpm; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.rpm"; done
          for f in *.tar.gz; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.tar.gz"; done
          for f in *.AppImage; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.AppImage"; done
          for f in *.pkg.tar.zst; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.pkg.tar.zst"; done

      - name: Generate Checksums
        run: |
          cd target/dist
          chmod +x *.AppImage
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/*
          draft: true
          prerelease: false
          generate_release_notes: true
