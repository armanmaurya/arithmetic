name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Standard Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev file zstd

      - name: Install appimagetool (Extracted, no FUSE needed)
        run: |
          curl -sLo /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          cd /tmp && /tmp/appimagetool --appimage-extract
          sudo mv /tmp/squashfs-root /usr/local/appimagetool
          sudo ln -s /usr/local/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Install official Cargo packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-aur

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Build stripped release binary
        run: cargo build --release

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Build Debian Package (cargo deb)
        run: cargo deb -o dist/

      - name: Build Red Hat Package (cargo generate-rpm)
        run: cargo generate-rpm -o dist/

      - name: Build Universal AppImage (cargo appimage)
        run: |
          cargo appimage
          if ls target/appimage/*.AppImage 1>/dev/null 2>&1; then
            cp target/appimage/*.AppImage dist/
          fi

      - name: Build Standalone Tarball (cargo aur)
        run: |
          cargo aur -o dist/
          rm -f dist/PKGBUILD

      - name: Normalize Asset Names
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v$VERSION"
          fi
          cd dist
          for f in *.deb; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-amd64.deb"; done
          for f in *.rpm; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.rpm"; done
          for f in *.tar.gz; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.tar.gz"; done
          for f in *.AppImage; do [[ -f "$f" ]] && mv "$f" "arithmetic-${VERSION}-x86_64.AppImage"; done

      - name: Upload Standard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standard-dist
          path: dist/*
          retention-days: 1

  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm cargo git fontconfig freetype2 libxkbcommon wayland

      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "./packaging/build-arch.sh dist --noconfirm"

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-dist
          path: dist/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-packages, build-arch]
    steps:
      - name: Download Standard Packages
        uses: actions/download-artifact@v4
        with:
          name: standard-dist
          path: release-assets

      - name: Download Arch Package
        uses: actions/download-artifact@v4
        with:
          name: arch-dist
          path: release-assets

      - name: Generate Checksums
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          prerelease: false
          generate_release_notes: true
