<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Outer Base Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242630"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>

    <!-- Secondary Operator Keys Gradient (+, −, ×) -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4154"/>
      <stop offset="100%" stop-color="#2B303E"/>
    </linearGradient>

    <!-- Primary Accent Equals Key Gradient (=) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E7DE8"/>
      <stop offset="100%" stop-color="#2652B0"/>
    </linearGradient>
  </defs>

  <!-- Outer Base Squircle Tile -->
  <rect x="14" y="14" width="228" height="228" rx="56" fill="url(#bgGrad)" stroke="#353846" stroke-width="2"/>

  <!-- Key Drop Shadows (SVG 1.1 compatible) -->
  <rect x="37" y="41" width="86" height="86" rx="26" fill="#000000" fill-opacity="0.35"/>
  <rect x="133" y="41" width="86" height="86" rx="26" fill="#000000" fill-opacity="0.35"/>
  <rect x="37" y="137" width="86" height="86" rx="26" fill="#000000" fill-opacity="0.35"/>
  <rect x="133" y="137" width="86" height="86" rx="26" fill="#000000" fill-opacity="0.35"/>

  <!-- Key 1 (Top-Left): Addition "+" -->
  <rect x="37" y="37" width="86" height="86" rx="26" fill="url(#keyGrad)" stroke="#4A526A" stroke-width="1"/>
  <rect x="65" y="76" width="30" height="8" rx="4" fill="#E1E7F8"/>
  <rect x="76" y="65" width="8" height="30" rx="4" fill="#E1E7F8"/>

  <!-- Key 2 (Top-Right): Minus "−" -->
  <rect x="133" y="37" width="86" height="86" rx="26" fill="url(#keyGrad)" stroke="#4A526A" stroke-width="1"/>
  <rect x="161" y="76" width="30" height="8" rx="4" fill="#E1E7F8"/>

  <!-- Key 3 (Bottom-Left): Multiply "×" -->
  <rect x="37" y="133" width="86" height="86" rx="26" fill="url(#keyGrad)" stroke="#4A526A" stroke-width="1"/>
  <g transform="translate(80, 176) rotate(45)">
    <rect x="-15" y="-4" width="30" height="8" rx="4" fill="#E1E7F8"/>
    <rect x="-4" y="-15" width="8" height="30" rx="4" fill="#E1E7F8"/>
  </g>

  <!-- Key 4 (Bottom-Right): Equals "=" (Signature Material You Accent Pill) -->
  <rect x="133" y="133" width="86" height="86" rx="26" fill="url(#accentGrad)" stroke="#6694FA" stroke-width="1"/>
  <!-- "=" Glyph (Center: 176, 176) -->
  <rect x="161" y="167" width="30" height="7.5" rx="3.75" fill="#FFFFFF"/>
  <rect x="161" y="178.5" width="30" height="7.5" rx="3.75" fill="#FFFFFF"/>
</svg>
